<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Text & Glows -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#accentGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    
    /* Subtle background animations */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.5; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      50% { transform: translate(-25px, 25px) scale(1.15); opacity: 0.45; }
    }
    @keyframes pulseLine {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: 40; opacity: 0.8; }
    }

    .orb1 { animation: floatOrb1 8s ease-in-out infinite; }
    .orb2 { animation: floatOrb2 10s ease-in-out infinite; }
    .anim-line { stroke-dasharray: 8, 8; animation: pulseLine 6s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind Content) -->
  <circle class="orb1" cx="150" cy="80" r="160" fill="#4f46e5" filter="url(#glow)" />
  <circle class="orb2" cx="1050" cy="240" r="180" fill="#0284c7" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Decorative Chart Graphics (Behind Text) -->
  <g transform="translate(860, 60)" opacity="0.25">
    <path d="M 0 160 L 60 120 L 120 140 L 180 70 L 240 90 L 300 20" fill="none" stroke="url(#accentGrad)" stroke-width="4" class="anim-line" />
    <circle cx="300" cy="20" r="6" fill="#38bdf8" />
    <path d="M 0 160 L 60 120 L 120 140 L 180 70 L 240 90 L 300 20 L 300 180 L 0 180 Z" fill="url(#accentGrad)" opacity="0.15" />
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Badge -->
    <rect width="280" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="14" y="18" class="tag">🚀 CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title">Awesome Alternative Investment Platform</text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle">SaaS Products &amp; Open-Source Tools for Private Equity, VC &amp; Fund Operations</text>

    <!-- Key Feature Badges (Foreground) -->
    <g transform="translate(0, 150)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">💼 Private Equity</text>

      <!-- Item 2 -->
      <rect x="177" y="0" width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#818cf8" stroke-width="1" />
      <text x="191" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">📈 Venture Capital</text>

      <!-- Item 3 -->
      <rect x="354" y="0" width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#c084fc" stroke-width="1" />
      <text x="368" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🏛️ LP &amp; Fund Ops</text>

      <!-- Item 4 -->
      <rect x="531" y="0" width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#4ade80" stroke-width="1" />
      <text x="545" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80">⚡ Open-Source Stack</text>
    </g>
  </g>
</svg>
